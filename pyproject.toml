[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-guardian-mcp"
version = "0.1.0"
description = "Read-only, guarded SQL access for AI agents over the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sql-guardian = "sql_guardian.server:main"

[tool.setuptools]
packages = ["sql_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
